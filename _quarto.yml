project:
  type: book
  output-dir: site
  resources:
    - .nojekyll

book:
  title: "Erdős í íslenskri verkfræði"
  subtitle: "Vinnanótur og endurgeranlegt viðbótarefni"
  repo-url: https://github.com/HI-IDN/erdos-eng-is
  repo-branch: erdos-eng
  repo-actions: [edit, issue]
  site-url: https://hi-idn.github.io/erdos-eng-is
  search: true
  page-footer:
    left: "© 2026 Helga Ingimundardóttir"
    center: "Vinnurit rannsóknar"
    right:
      - icon: github
        href: https://github.com/HI-IDN/erdos-eng-is
        aria-label: GitHub-kóðasafn
  navbar:
    background: primary
    tools:
      - icon: github
        href: https://github.com/HI-IDN/erdos-eng-is
        aria-label: GitHub-kóðasafn
  sidebar:
    style: docked
    background: light
  chapters:
    - index.qmd
    - docs/01-research-questions.qmd
    - docs/02-data-and-provenance.qmd
    - docs/03-network-methods.qmd
    - docs/04-analysis-log.qmd

format:
  html:
    theme:
      - cosmo
      - styles/hi-book.scss
    toc: true
    toc-depth: 3
    number-sections: true
    code-fold: true
    code-summary: "Sýna kóðann"
    code-copy: true
    code-overflow: wrap
    smooth-scroll: true
    fig-width: 9
    fig-height: 5.5

execute:
  freeze: auto
  echo: true
  warning: false
  message: false

language:
  section-title-appendices: "Viðauki"
  toc-title-document: "Efnisyfirlit"
  toc-title-website: "Á þessari síðu"
  back-to-top: "Efst á síðu"
  search-text-placeholder: "Leita"
  repo-action-links-edit: "Breyta þessari síðu"
  repo-action-links-issue: "Tilkynna villu"
  repo-action-links-source: "Skoða frumkóða"
  copy-button-tooltip: "Afrita"
  copy-button-tooltip-success: "Afritað!"
  search-no-results-text: "Engar niðurstöður"
  crossref-ch-prefix: "Kafli"
  crossref-sec-prefix: "Hluti"
  crossref-fig-title: "Mynd"
  crossref-tbl-title: "Tafla"
